name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia
  workflow_dispatch:       # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6d28d9&color_dots=#ede9fe,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#1f1b2e,#3b2a6b,#5b3fa8,#7c5ce0,#a78bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
