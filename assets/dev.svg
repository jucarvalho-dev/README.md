<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <style>
    .f1{animation:fl 3s ease-in-out infinite} .f2{animation:fl 3.8s ease-in-out infinite .9s} .f3{animation:fl 4.4s ease-in-out infinite 1.7s}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .head{animation:nod 5s ease-in-out infinite;transform-origin:200px 175px}
    @keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}60%{transform:rotate(2deg)}}
    .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes blink{0%,45%,51%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    .armL{animation:tL .32s ease-in-out infinite alternate} .armR{animation:tR .32s ease-in-out infinite alternate .16s}
    @keyframes tL{to{transform:translateY(-3px)}} @keyframes tR{to{transform:translateY(-3px)}}
    .ln{transform-box:fill-box;transform-origin:left center;animation:w 3.2s ease-in-out infinite}
    .l2{animation-delay:.35s} .l3{animation-delay:.7s} .l4{animation-delay:1.05s}
    @keyframes w{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .cur{animation:c .9s steps(1) infinite} @keyframes c{50%{opacity:0}}
    .glow{animation:g 3.2s ease-in-out infinite} @keyframes g{50%{opacity:.55}}
    .s{font-family:'Fira Code',Consolas,monospace;font-weight:700}
  </style>

  <circle cx="200" cy="160" r="128" fill="#ede9fe" opacity=".55"/>

