<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <style>
    .float1 { animation: float 3s ease-in-out infinite; }
    .float2 { animation: float 3.6s ease-in-out infinite 0.8s; }
    .float3 { animation: float 4.2s ease-in-out infinite 1.6s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .head { animation: nod 4s ease-in-out infinite; transform-origin: 200px 150px; }
    @keyframes nod { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-3deg); } 60% { transform: rotate(2deg); } }

    .eyes { animation: blink 4s infinite; transform-origin: 200px 112px; }
    @keyframes blink { 0%,44%,50%,100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }

    .handL { animation: typeL 0.35s ease-in-out infinite alternate; }
    .handR { animation: typeR 0.35s ease-in-out infinite alternate 0.17s; }
    @keyframes typeL { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes typeR { from { transform: translateY(-5px); } to { transform: translateY(0); } }

    .code { transform-box: fill-box; transform-origin: left center; animation: write 3s ease-in-out infinite; }
    .c2 { animation-delay: 0.4s; } .c3 { animation-delay: 0.8s; } .c4 { animation-delay: 1.2s; } .c5 { animation-delay: 1.6s; }
    @keyframes write { 0% { transform: scaleX(0); } 40%,85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }

    .cursor { animation: cur 0.8s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }

    .sym { font-family: 'Fira Code', Consolas, monospace; font-weight: 700; }
  </style>

  <!-- símbolos flutuando -->
  <g class="float1"><text x="40" y="70" class="sym" font-size="26" fill="#a78bfa">&lt;/&gt;</text></g>
  <g class="float2"><text x="320" y="60" class="sym" font-size="26" fill="#c4b5fd">{ }</text></g>
  <g class="float3"><text x="335" y="150" class="sym" font-size="20" fill="#8b5cf6">( )</text></g>
  <g class="float2"><text x="30" y="160" class="sym" font-size="20" fill="#c4b5fd">=&gt;</text></g>

