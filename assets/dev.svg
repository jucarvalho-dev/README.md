<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <style>
    .float1 { animation: float 3s ease-in-out infinite; }
    .float2 { animation: float 3.6s ease-in-out infinite 0.8s; }
    .float3 { animation: float 4.2s ease-in-out infinite 1.6s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .head { animation: nod 4s ease-in-out infinite; transform-origin: 200px 150px; }
    @keyframes nod { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-3deg); } 60% { transform: rotate(2deg); } }

    .eyes { animation: blink 4s infinite; transform-origin: 200px 112px; }
    @keyframes blink { 0%,44%,50%,100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }

    .handL { animation: typeL 0.35s ease-in-out infinite alternate; }
    .handR { animation: typeR 0.35s ease-in-out infinite alternate 0.17s; }
    @keyframes typeL { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes typeR { from { transform: translateY(-5px); } to { transform: translateY(0); } }

    .code { transform-box: fill-box; transform-origin: left center; animation: write 3s ease-in-out infinite; }
    .c2 { animation-delay: 0.4s; } .c3 { animation-delay: 0.8s; } .c4 { animation-delay: 1.2s; } .c5 { animation-delay: 1.6s; }
    @keyframes write { 0% { transform: scaleX(0); } 40%,85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }

    .cursor { animation: cur 0.8s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }

    .sym { font-family: 'Fira Code', Consolas, monospace; font-weight: 700; }
  </style>

  <!-- símbolos flutuando -->
  <g class="float1"><text x="40" y="70" class="sym" font-size="26" fill="#a78bfa">&lt;/&gt;</text></g>
  <g class="float2"><text x="320" y="60" class="sym" font-size="26" fill="#c4b5fd">{ }</text></g>
  <g class="float3"><text x="335" y="150" class="sym" font-size="20" fill="#8b5cf6">( )</text></g>
  <g class="float2"><text x="30" y="160" class="sym" font-size="20" fill="#c4b5fd">=&gt;</text></g>

  <!-- cabeça -->
  <g class="head">
    <!-- coque -->
    <circle cx="200" cy="58" r="18" fill="#4c1d95"/>
    <!-- cabelo atrás -->
    <path d="M152 118 Q150 72 200 70 Q250 72 248 118 L250 160 Q232 150 228 128 L172 128 Q168 150 150 160 Z" fill="#4c1d95"/>
    <!-- rosto -->
    <ellipse cx="200" cy="115" rx="40" ry="42" fill="#fde7d9"/>
    <!-- franja -->
    <path d="M160 108 Q165 74 200 74 Q238 74 241 106 Q222 92 196 96 Q176 98 160 108 Z" fill="#5b21b6"/>
    <!-- olhos -->
    <g class="eyes">
      <ellipse cx="185" cy="116" rx="4" ry="5" fill="#1e1b2e"/>
      <ellipse cx="215" cy="116" rx="4" ry="5" fill="#1e1b2e"/>
    </g>
    <!-- óculos -->
    <rect x="172" y="105" width="26" height="21" rx="8" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="202" y="105" width="26" height="21" rx="8" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <line x1="198" y1="114" x2="202" y2="114" stroke="#7c3aed" stroke-width="2.5"/>
    <!-- bochechas e boca -->
    <ellipse cx="176" cy="133" rx="6" ry="3.5" fill="#f9a8d4" opacity="0.6"/>
    <ellipse cx="224" cy="133" rx="6" ry="3.5" fill="#f9a8d4" opacity="0.6"/>
    <path d="M192 138 Q200 145 208 138" fill="none" stroke="#1e1b2e" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- corpo -->
  <path d="M140 230 Q140 170 200 166 Q260 170 260 230 Z" fill="#7c3aed"/>
  <path d="M188 168 L200 182 L212 168" fill="none" stroke="#ede9fe" stroke-width="3"/>

  <!-- notebook -->
  <rect x="110" y="196" width="180" height="16" rx="4" fill="#ede9fe"/>
  <path d="M125 196 L140 120 L300 120 L285 196 Z" fill="#1e1b2e" opacity="0"/>
  <rect x="120" y="212" width="160" height="8" rx="3" fill="#c4b5fd"/>
  <rect x="80" y="220" width="240" height="10" rx="5" fill="#a78bfa"/>

  <!-- mãos digitando -->
  <g class="handL"><ellipse cx="165" cy="207" rx="11" ry="7" fill="#fde7d9"/></g>
  <g class="handR"><ellipse cx="235" cy="207" rx="11" ry="7" fill="#fde7d9"/></g>

  <!-- tela flutuante com código -->
  <g transform="translate(110 236)">
    <rect x="0" y="0" width="180" height="78" rx="10" fill="#13111c" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="14" cy="12" r="3.5" fill="#f472b6"/>
    <circle cx="26" cy="12" r="3.5" fill="#c4b5fd"/>
    <circle cx="38" cy="12" r="3.5" fill="#8b5cf6"/>
    <rect class="code c1" x="14" y="24" width="70" height="6" rx="3" fill="#a78bfa"/>
    <rect class="code c2" x="26" y="36" width="110" height="6" rx="3" fill="#ede9fe"/>
    <rect class="code c3" x="26" y="48" width="80" height="6" rx="3" fill="#c4b5fd"/>
    <rect class="code c4" x="38" y="60" width="95" height="6" rx="3" fill="#8b5cf6"/>
    <rect class="cursor" x="140" y="58" width="3" height="10" fill="#ede9fe"/>
  </g>
</svg>
